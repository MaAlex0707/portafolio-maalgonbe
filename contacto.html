<header class="hero">
  <div class="hero-text">
    <h1 class="hero-title">¡Contactame!</h1>
  </div>
</header>
<main class="main-contact">
  <div class="contact-card">
    <p class="contact-intro-label">¿Tienes un proyecto en mente?</p>
    <p class="contact-intro-text">Cuéntame sobre tu idea y con gusto te respondo. También puedes escribirme directamente a <a href="mailto:tu@correo.com">magonryu@gmail.com</a></p>
    
    <form id="contactForm" class="contact-form" action="https://formsubmit.co/magonryu@gmail.com" method="POST">

      <div class="contact-row">
        <div class="contact-field">
          <label class="contact-label">Nombre *</label>
          <input type="text" name="nombre" required placeholder="Tu nombre" class="contact-input">
        </div>
        <div class="contact-field">
          <label class="contact-label">Correo *</label>
          <input type="email" name="correo" required placeholder="tu@correo.com" class="contact-input">
        </div>
      </div>

      <div class="contact-field">
        <label class="contact-label">Tipo de proyecto</label>
        <select name="tipo" class="contact-select">
          <option value="">— Selecciona una opción —</option>
          <option>Ilustración digital</option>
          <option>Concept Art</option>
          <option>Modelado 3D</option>
          <option>Diseño de personajes</option>
          <option>Manual de marca</option>
          <option>UI / UX</option>
          <option>Otro</option>
        </select>
      </div>

      <div class="contact-field">
        <label class="contact-label">Mensaje *</label>
        <textarea name="mensaje" required rows="5" placeholder="Cuéntame sobre tu proyecto, plazos, referencias…" class="contact-textarea"></textarea>
      </div>

      <button type="submit" id="submitBtn" class="contact-submit">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
        Enviar mensaje
      </button>

      <p id="formMsg" class="contact-msg"></p>

    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" name="_template" value="table">
    <input type="hidden" name="_subject" value="Nuevo mensaje desde el portafolio">

    </form>

  </div>
</main>

<script>
  document.getElementById('hamburger').addEventListener('click', () =>
    document.getElementById('mobileMenu').classList.toggle('open'));
  document.querySelectorAll(".dropbtn").forEach(btn => {
    btn.addEventListener("click", function(e) {
      e.stopPropagation();
      const content = this.nextElementSibling;
      const isOpen = content.classList.contains("open");
      document.querySelectorAll(".dropdown-content.open").forEach(d => d.classList.remove("open"));
      if (!isOpen) content.classList.add("open");
    });
  });
  document.addEventListener("click", () => {
    document.querySelectorAll(".dropdown-content.open").forEach(d => d.classList.remove("open"));
  });
</script>

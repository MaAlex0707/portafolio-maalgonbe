
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <title>MindAR</title>
    <link rel="icon" type="image/svg+xml" href="imagenes/mee cartoon5.png">
  </head>

  <body>
    <a-scene mindar-image="imageTargetSrc: https://maalex0707.github.io/AI-MIND/targets.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets>
        <img id="card" src="https://maalex0707.github.io/AI-MIND/carta.jpg" />
        <a-asset-item id="avatarModel" src="modelos/happy_nutria.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      <a-entity mindar-image-target="targetIndex: 0">
        <a-plane src="#card" position="0 0 0" height="1.5" width="1" rotation="0 0 0"></a-plane>
        <a-gltf-model rotation="0 0 0 " position="0 0.8 0.1" scale="0.03 0.03 0.03" src="#avatarModel" 
        animation="property: position; to: 0 0 1; dur: 1000; easing: easeInOutQuad; loop: true; dir: alternate"
        >
      </a-entity>
    </a-scene>
  </body>

</html>
